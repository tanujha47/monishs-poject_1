<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | StudyHub</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            📚 Study<span>Hub</span>
        </a>

        <div class="nav-buttons">

            <a href="index.html" class="login-link">
                ← Back Home
            </a>

        </div>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                👨‍🎓
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join StudyHub and start sharing knowledge.
            </p>


            <!-- ================= REGISTER FORM ================= -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary full-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- ================= LOGIN LINK ================= -->

            <p class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const full_name =
                        document.getElementById("name").value;

                    const email =
                        document.getElementById("email").value;

                    const password =
                        document.getElementById("password").value;

                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    // ===============================
                    // PASSWORD VALIDATION
                    // ===============================

                    if (
                        password !==
                        confirmPassword
                    ) {

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                "/api/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({

                                        full_name:
                                            full_name,

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                                }
                            );


                        const data =
                            await response.json();


                        if (response.ok) {

                            alert(
                                data.message
                            );


                            window.location.href =
                                "login.html";

                        } else {

                            alert(
                                data.message
                            );

                        }


                    } catch (error) {

                        console.error(error);

                        alert(
                            "Unable to connect to the server."
                        );

                    }

                }
            );

    </script>

</body>

</html>
