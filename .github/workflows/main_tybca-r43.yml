name: Deploy StudyHub to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare website package
        run: |
          mkdir deploy
          cp -r pages css js deploy/
          cp index.html deploy/index.html

          # Do not include environment secrets
          rm -f deploy/.env

          cd deploy
          zip -r ../studyhub.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F040CB49AEEB4716AB57E3CBC2857A2C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_07E17165237E461A84985FCE85D6ADFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D187EA498F9141AE8B63768525328009 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tybca-r43
          slot-name: Production
          package: studyhub.zip
